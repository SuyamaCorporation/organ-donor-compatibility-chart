<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organ Donor Blood Type Compatibility Chart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white; }
      .no-print { display: none; }
      table { font-size: 12px; }
    }
    .compat-cell { cursor: pointer; transition: transform 0.1s; }
    .compat-cell:hover { transform: scale(1.1); z-index: 10; position: relative; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Organ Donor Blood Type Compatibility</h1>
    <p class="text-gray-600 mb-5">ABO blood type compatibility matrix by organ/component type</p>

    <!-- Filter -->
    <div class="no-print mb-5 flex flex-wrap gap-2 items-center">
      <span class="text-sm font-medium text-gray-700">Filter by type:</span>
      <button onclick="setFilter('rbc')" id="btn-rbc"
        class="filter-btn px-4 py-2 rounded-full text-sm font-medium border-2 focus:outline-none focus:ring-2 focus:ring-red-400 transition-colors">Red Blood Cells</button>
      <button onclick="setFilter('whole')" id="btn-whole"
        class="filter-btn px-4 py-2 rounded-full text-sm font-medium border-2 focus:outline-none focus:ring-2 focus:ring-red-400 transition-colors">Whole Blood</button>
      <button onclick="setFilter('plasma')" id="btn-plasma"
        class="filter-btn px-4 py-2 rounded-full text-sm font-medium border-2 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">Plasma</button>
      <button onclick="setFilter('platelets')" id="btn-platelets"
        class="filter-btn px-4 py-2 rounded-full text-sm font-medium border-2 focus:outline-none focus:ring-2 focus:ring-purple-400 transition-colors">Platelets</button>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-4 overflow-x-auto mb-6">
      <h2 id="tableTitle" class="text-base font-semibold text-gray-700 mb-3"></h2>
      <table id="compatTable" class="border-collapse text-sm min-w-[500px]">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="mt-3 flex gap-4 text-xs text-gray-500">
        <span><span class="inline-block w-4 h-4 rounded bg-green-200 mr-1"></span>Compatible</span>
        <span><span class="inline-block w-4 h-4 rounded bg-red-200 mr-1"></span>Incompatible</span>
        <span class="text-gray-400">Click a cell for explanation</span>
      </div>
    </div>

    <!-- Explanation panel -->
    <div id="explainPanel" class="hidden bg-white rounded-2xl shadow-md p-5 mb-6 border-l-4 border-indigo-500">
      <h3 class="font-semibold text-gray-800 mb-1" id="explainTitle"></h3>
      <p id="explainText" class="text-sm text-gray-600"></p>
    </div>

    <div class="no-print">
      <button onclick="window.print()"
        class="bg-gray-700 hover:bg-gray-800 text-white text-sm font-medium rounded-lg px-5 py-2 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
        Print Chart
      </button>
    </div>
  </div>

  <script>
    const bloodTypes = ['O−','O+','A−','A+','B−','B+','AB−','AB+'];

    // Compatibility rules: [donor][recipient] = bool
    // Red blood cells & whole blood: recipient must have same or universal (O neg donates all, AB+ receives all)
    const rbcCompat = {
      'O−':  { 'O−':1,'O+':1,'A−':1,'A+':1,'B−':1,'B+':1,'AB−':1,'AB+':1 },
      'O+':  { 'O+':1,'A+':1,'B+':1,'AB+':1 },
      'A−':  { 'A−':1,'A+':1,'AB−':1,'AB+':1 },
      'A+':  { 'A+':1,'AB+':1 },
      'B−':  { 'B−':1,'B+':1,'AB−':1,'AB+':1 },
      'B+':  { 'B+':1,'AB+':1 },
      'AB−': { 'AB−':1,'AB+':1 },
      'AB+': { 'AB+':1 },
    };
    // Plasma: reverse of RBC — AB is universal donor
    const plasmaCompat = {
      'AB+': { 'O−':1,'O+':1,'A−':1,'A+':1,'B−':1,'B+':1,'AB−':1,'AB+':1 },
      'AB−': { 'O−':1,'O+':1,'A−':1,'A+':1,'B−':1,'B+':1,'AB−':1,'AB+':1 },
      'A+':  { 'A+':1,'O+':1,'AB+':1,'AB−':1 },
      'A−':  { 'A−':1,'O−':1 },
      'B+':  { 'B+':1,'O+':1,'AB+':1,'AB−':1 },
      'B−':  { 'B−':1,'O−':1 },
      'O+':  { 'O+':1,'AB+':1 },
      'O−':  { 'O−':1 },
    };
    // Platelets: generally ABO-compatible preferred, but any can be used; simplified
    const plateletCompat = {
      'O−':  { 'O−':1,'O+':1,'A−':1,'A+':1,'B−':1,'B+':1,'AB−':1,'AB+':1 },
      'O+':  { 'O−':1,'O+':1,'A−':1,'A+':1,'B−':1,'B+':1,'AB−':1,'AB+':1 },
      'A−':  { 'A−':1,'A+':1,'O−':1,'O+':1 },
      'A+':  { 'A−':1,'A+':1,'O−':1,'O+':1 },
      'B−':  { 'B−':1,'B+':1,'O−':1,'O+':1 },
      'B+':  { 'B−':1,'B+':1,'O−':1,'O+':1 },
      'AB−': { 'AB−':1,'AB+':1,'A−':1,'A+':1,'B−':1,'B+':1,'O−':1,'O+':1 },
      'AB+': { 'AB−':1,'AB+':1,'A−':1,'A+':1,'B−':1,'B+':1,'O−':1,'O+':1 },
    };

    const filterMeta = {
      rbc:      { label: 'Red Blood Cells', rules: rbcCompat, color: 'red' },
      whole:    { label: 'Whole Blood',      rules: rbcCompat, color: 'red' },
      plasma:   { label: 'Plasma',           rules: plasmaCompat, color: 'blue' },
      platelets:{ label: 'Platelets',        rules: plateletCompat, color: 'purple' },
    };

    let currentFilter = 'rbc';

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = b.className.replace(' bg-gray-200 border-gray-500', '').replace(' bg-red-100 border-red-500', '').replace(' bg-blue-100 border-blue-500', '').replace(' bg-purple-100 border-purple-500', '');
      });
      const btn = document.getElementById('btn-' + f);
      const meta = filterMeta[f];
      const colorMap = { red: ' bg-red-100 border-red-500', blue: ' bg-blue-100 border-blue-500', purple: ' bg-purple-100 border-purple-500' };
      btn.className += colorMap[meta.color] || ' bg-gray-200 border-gray-500';
      renderTable();
      document.getElementById('explainPanel').classList.add('hidden');
    }

    function renderTable() {
      const meta = filterMeta[currentFilter];
      document.getElementById('tableTitle').textContent = meta.label + ' Compatibility (Donor → Recipient)';

      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      // Header row: recipient types
      const htr = document.createElement('tr');
      const corner = document.createElement('th');
      corner.className = 'px-2 py-2 text-xs text-gray-500 font-medium';
      corner.innerHTML = '<span class="text-gray-400 text-xs">Donor ↓ / Recipient →</span>';
      htr.appendChild(corner);
      bloodTypes.forEach(bt => {
        const th = document.createElement('th');
        th.className = 'px-3 py-2 text-center text-xs font-semibold text-gray-700 border border-gray-200';
        th.textContent = bt;
        htr.appendChild(th);
      });
      thead.appendChild(htr);

      // Body rows: donor types
      bloodTypes.forEach(donor => {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.className = 'px-3 py-2 text-xs font-semibold text-gray-700 border border-gray-200 text-right';
        th.textContent = donor;
        tr.appendChild(th);

        bloodTypes.forEach(recipient => {
          const isCompat = !!(meta.rules[donor] && meta.rules[donor][recipient]);
          const td = document.createElement('td');
          td.className = 'compat-cell px-3 py-2 text-center border border-gray-200 text-base ' +
            (isCompat ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-400');
          td.textContent = isCompat ? '✓' : '✗';
          td.setAttribute('role', 'button');
          td.setAttribute('tabindex', '0');
          td.setAttribute('aria-label', `Donor ${donor} to recipient ${recipient}: ${isCompat ? 'compatible' : 'incompatible'}`);
          td.onclick = () => showExplanation(donor, recipient, isCompat, meta.label);
          td.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') td.onclick(); };
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function showExplanation(donor, recipient, isCompat, type) {
      const panel = document.getElementById('explainPanel');
      const title = document.getElementById('explainTitle');
      const text = document.getElementById('explainText');
      panel.classList.remove('hidden');
      panel.className = panel.className.replace('border-indigo-500','').replace('border-green-500','').replace('border-red-500','');
      panel.className += isCompat ? ' border-green-500' : ' border-red-500';
      title.textContent = `${donor} → ${recipient}: ${isCompat ? 'Compatible ✓' : 'Incompatible ✗'}`;
      if (isCompat) {
        text.textContent = `For ${type}: A donor with blood type ${donor} is compatible with a recipient of type ${recipient}. The ABO antigens present in the donor are recognized as self by the recipient's immune system, preventing rejection.`;
      } else {
        text.textContent = `For ${type}: A donor with blood type ${donor} is NOT compatible with a recipient of type ${recipient}. The recipient's antibodies would attack the donor's antigens, potentially causing a transfusion reaction.`;
      }
    }

    setFilter('rbc');
  </script>
</body>
</html>
